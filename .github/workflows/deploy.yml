name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Validate course data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,slides]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test course data
        run: pytest

      # The deck media is generated, never committed — same rule as the
      # session pages. gen_slides.py fails the build if this step is skipped.
      - name: Generate lecture media
        run: |
          cd scripts
          for f in gen_*.py; do python "$f"; done
          python build_deck.py

      - name: Build site
        run: mkdocs build --strict

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  # Publishes on every push to main, but only after lint, tests, and a strict
  # build pass. A broken syllabus never reaches the live URL.
  #
  # The URL is live but unannounced while the course is still being edited.
  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
