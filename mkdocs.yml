site_name: LLMs & You
site_description: >-
  Attention is All You Need — a prompt engineering course.
  Hampden-Sydney College, Fall 2026.
site_author: Sean Gleason

# Update these two when the GitHub repo exists.
site_url: https://Nalaquq.github.io/llms-and-you/
repo_url: https://github.com/Nalaquq/llms-and-you
repo_name: llms-and-you
edit_uri: ""

copyright: >-
  Course materials &copy; 2026 Sean Gleason, Hampden-Sydney College.
  Linked readings remain the property of their publishers.

theme:
  name: material
  language: en
  icon:
    logo: material/graph-outline
    repo: fontawesome/brands/github
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.tooltips
    - content.code.copy
    # Pick "Windows" once and every command on the site follows.
    - content.tabs.link

plugins:
  - search
  - macros:
      module_name: src/course_site/macros
  - gen-files:
      scripts:
        - src/course_site/gen_sessions.py

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  # Lets docs/changelog.md include the root CHANGELOG.md, so the changelog
  # lives in one place and is visible both in the repo and on the site.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tilde

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/solid/envelope
      link: mailto:sgleason@hsc.edu
      name: Email the instructor
    - icon: fontawesome/brands/github
      link: https://github.com/Nalaquq/llms-and-you
      name: Course repository
  generator: false

nav:
  - Home: index.md
  - Syllabus: syllabus.md
  - Schedule: schedule.md
  - Assignments: assignments.md
  - Readings: resources.md
  - Guides:
      - guides/index.md
      - guides/setup.md
      - guides/reading-papers.md
      - guides/writing-adrs.md
      - guides/conference-weeks.md
  - Decisions: adr/index.md
  - What's changed: changelog.md
