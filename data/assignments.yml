# Graded components. Weights must total 100 -- tests/test_course_data.py enforces it.
#
# `genai` records whether Generative AI may be used. The course policy is
# permissive by default, so ALLOWED is the norm and PROHIBITED is the exception
# that must carry a `genai_note` explaining itself -- the models refuse to
# validate a prohibition without a stated reason, because the policy promises
# students that every restriction is stated on the page.

- id: project
  title: Semester Project and ADR Log
  weight: 35
  due: Thursday, December 3
  summary: >-
    A prompt-engineering system of your own design, built across the semester,
    submitted with the decision log you kept while building it. The log is not
    documentation written afterwards; it is a record written as you decided.
    Four ADRs are due at checkpoints during the term and are graded as you go.
  # The four checkpoints. No dates here -- each names the meeting it is due at
  # and calendar.py supplies the date, as everywhere else. The guide's table,
  # the milestone table, and the session's own "Due today" banner all come from
  # this list, so they cannot disagree with each other again.
  adrs:
    - id: ADR-001
      week: 1
      day: thu
      decision: Any decision you made setting up your repository and tools
    - id: ADR-002
      week: 5
      day: thu
      decision: Technique selection for your project
    - id: ADR-003
      week: 9
      day: thu
      decision: How your system handles failure
    - id: ADR-004
      week: 10
      day: thu
      decision: Retrieval design -- or why you are not using retrieval

- id: midterm
  title: HackAPrompt Red-Team Midterm
  weight: 15
  due: Thursday, October 22
  summary: >-
    Adversarial prompting against the HackAPrompt environment, submitted as a
    write-up of your most effective attack, why it worked, and the defence you
    would build against it.

- id: labs
  title: Thursday Labs
  weight: 20
  summary: >-
    Ten hands-on sessions. Each has a notebook you work through beforehand, at
    whatever depth interests you; the session itself is you showing the room one
    thing you found. Graded on the write-up rather than the result -- a lab that
    failed and was documented honestly scores better than one that worked and
    was not. You do not need working code to have something to show.

- id: concept-checks
  title: Concept Checks at Individual Meetings
  weight: 20
  genai: prohibited
  genai_note: >-
    These are spoken, one to one, from the study guide. You answer out of your
    own head; there is nothing to submit and nothing to consult while you are
    answering. Preparing with a model is fine and is just studying -- ask it to
    quiz you on the mastery lines. Putting a model between you and the answer
    during the meeting is not, and it is the one thing fifteen minutes across a
    desk makes obvious.
  summary: >-
    At each individual meeting you are asked to define and apply concepts drawn
    from the study guide -- everything taught up to that week, including the
    Burchell arc as it stands. Answered out loud, in your own words. The study
    guide is the whole of what can be asked, which is the point of keeping it:
    nothing outside that page appears, and the page tells you in advance what
    you should be able to do with each idea.

- id: progress-reports
  title: Oral Progress Reports
  weight: 10
  summary: >-
    The other half of each individual meeting. A short spoken account of where
    your project stands: what you built since we last met, what broke, what you
    decided and why, and what you intend next. Graded on whether you can say
    plainly where you are -- a project that stalled and is described accurately
    scores better than one described vaguely. Each report ends with the written
    goal for the next stretch, which is where the following meeting starts.
