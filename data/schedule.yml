    - Is your Week 7 evaluation measuring factuality, hallucination, or something else?
  activity: LLM-as-judge — using a model to grade a model, and where that breaks.

- week: 9
  day: thu
  kind: milestone
  topic: Red-Team Debrief
  theme: responsible
  summary: What broke, how, and what it implies about deploying these systems.
  due: HackAPrompt midterm write-up
