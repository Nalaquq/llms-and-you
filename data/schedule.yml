    Students present their most effective attack and the defence they would
    build against it. ADR-003 due: how your project handles failure.

# ===========================================================================
# WEEK 10 — RAG  (both sessions: individual meetings)
# ===========================================================================

- week: 10
  day: tue
  topic: 'Individual Meetings: Retrieval-Augmented Generation'
  theme: rag
