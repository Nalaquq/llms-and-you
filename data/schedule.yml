# The 28 meetings of Fall 2026.
#
# No dates here. Sessions declare (week, day); calendar.py assigns the real date
# and flags it as an individual-meeting session if it falls inside such a window.
#
# `guides` points at a page in docs/guides/, optionally at one heading in it,
# and is validated against the file. If we wrote a guide, the session where a
# student needs it has to name it -- see test_every_guide_is_reachable_from_a_session.
#
# Rhythm: Tuesday carries the reading, Thursday is hands-on and assigns no new
# prep. Two weeks break the pattern because a break removes one meeting (W8, W14),
# and three weeks run as individual meetings rather than a group class (W4, W5, W10).

# ===========================================================================
# WEEK 1 — Orientation
# ===========================================================================

- week: 1
  day: tue
  topic: Attention, and Why This Course Is Named After a Paper
  theme: foundations
  summary: >-
    What the course is, how it runs, and what an LLM actually is before we go
    anywhere near the mathematics. We also set the ground rules for using these
    tools on work you submit.
  readings: []
  optional: [karpathy-busy-person-intro, ms-copilot, boodlebox]
  questions:
    - What do you currently believe an LLM is doing when it answers you?
    - Where did that belief come from?
    - >-
      What would count as using these tools well in a course about them, and
      what would count as using them badly?
  activity: >-
    Syllabus walkthrough and a live prompting demo where the model is asked
    something it will confidently get wrong. We then spend real time on the AI
    policy: what counts as a hallucination, what counts as slop, what an
    adequate citation looks like, and where the line sits. Bring hard cases --
    the ambiguous ones are the useful ones, and it is better to argue about
    them now than in Week 9.

- week: 1
  day: thu
  kind: lab
  topic: 'Lab: Your Repository, and a Decision Record'
  theme: methodology
  notebook_exempt: >-
    Nothing to run today. This session is a GitHub account and the first
    decision record, both done in the browser -- the notebooks start in Week 2.
  due: >-
    ADR-001 -- any one of today's decisions, written up and committed
  summary: >-
    We build the thing you will work in for the rest of the semester -- a GitHub
    account and your own copy of the project template. Then the practice that
    runs through the whole course: writing down what you decided and why, while
    you are deciding it.


    **Everything today happens in a web browser.** Nothing is installed on your
    machine and there is no terminal. If you would rather work from the command
    line, the setup guide has that route as well and you are welcome to it --
    but it is an option, not the path.
  guides:
    - 'setup#week-1-your-repository-in-the-browser'
    - writing-adrs
  activity: |-
    Steps 1 to 5 are done together, one at a time, on whatever machine you
    brought. Nothing is assumed and nothing gets installed.

    Every step below is also written out in
    [the setup guide](../guides/setup.md#week-1-your-repository-in-the-browser).
    That page is the fallback: use it if you miss this session, if you get a
    step wrong, or if you are setting up a second machine later in the term.

    **Windows, macOS, Linux, or a Chromebook -- all four are fine.** That is the
    point of doing it this way. A browser is the only requirement in this course
    until you decide otherwise.

    ### 1. Make a GitHub account

    Free, at [github.com](https://github.com). Pick a username you would be
    willing to put on a CV -- this account will outlive the course.

    Use an email address you will still have after you graduate. It goes on
    every commit you make, permanently and in public; if you would rather it
    were not your real one, GitHub will give you a private forwarding address
    and the guide explains where.
    [:material-compass-outline: Guide](../guides/setup.md#a-github-account)

    ### 2. Make your own copy of the project template

    Open [the course project
    template](https://github.com/Nalaquq/llms-and-you-project) and press the
    green **Use this template** button, then **Create a new repository**. Name
    it whatever you like. Make it **public**.

    That gives you a repository that is *yours*, on your own account, with a
    clean history starting at your first commit.

    **Why not fork it?** A fork stays tied to mine -- it is presented as a
    contribution to my project rather than a project of your own, and it carries
    my whole history with it. A template copy is a genuine start.

    Where the repository lives and what it is called sounds trivial. It is the
    first of today's decisions, and you will be writing it up before you leave.
    [:material-compass-outline: Guide](../guides/setup.md#your-own-copy-of-the-project-template)

    ### 3. Look at what you just got

    Read the `README.md` on your new repository's front page, then open
    `PROMPTING.md`, the `adr/` folder, and `TODO.txt`. Five minutes, in the
    browser.

    You are looking for where things go, not understanding all of it. The one
    thing worth noticing today: prompts are kept as **files**, with a history,
    rather than pasted into a chat window and lost.

    ### 4. Edit a file on github.com and commit it

    This is the whole Git workflow, and you can do all of it from the web page.

    Open `adr/ADR-001.md` in your repository, press the pencil icon, and write.
    When you are done, scroll to the bottom, put a real sentence in the commit
    message box, and press **Commit changes**.

    That is a commit. It is a saved, dated, described version of your work that
    you can return to. Nothing else in this course requires more Git than that
    -- and the button you just pressed is doing exactly what `git commit` does.
    [:material-compass-outline: Guide](../guides/setup.md#editing-and-committing-in-the-browser)

    ### 5. Write ADR-001, and commit it

    A decision record is not a note. It says what you decided, what else you
    could have done, and what it cost you. The template is in your repository
    and the [guide](../guides/writing-adrs.md) explains each section.

    You made at least four decisions in the last hour without noticing:

    - what to call your repository, and whether to make it public
    - whether to use your real email address on your commits
    - whether to work in the browser or set up a local toolchain later
    - what to write in that first commit message

    Pick **one**. Write it up. Commit it.

    **What is graded is whether the alternatives section contains a real
    alternative** -- something you actually considered and rejected, with the
    reason. "I could have done it differently" is not an alternative.

    ### If you want the command line

    Some of you will prefer it, and it is genuinely better once you are past the
    first week -- branching, history, and working offline are all easier. It is
    written up in full at [the command-line
    route](../guides/setup.md#the-command-line-route-optional), and I will help
    anyone who wants it in office hours.

    It is not required at any point this semester, and choosing not to use it
    costs you no marks. That is itself a decision worth recording.

    Something not working? [When something
    breaks](../guides/setup.md#when-something-breaks) lists the errors this lab
    actually produces and what each one means. Bring the exact error text.
  optional:
    - github
    - project-template
    - github-hello-world
    - git-handbook
    - adr-github
    - adr-templates
    - git-scm
    - github-cli
    - vscode

# ===========================================================================
# WEEK 2 — How text becomes numbers
# ===========================================================================

- week: 2
  day: tue
  topic: How Text Becomes Numbers
  theme: foundations
  summary: >-
    Tokens and embeddings. The unglamorous step everyone skips, and the reason
    models behave strangely at the edges of words.


    This is the heaviest preparation week of the term, and deliberately so --
    everything after it assumes you know what a vector of numbers is doing here.
    Most of the load is listening, not reading. Start on the weekend.


    **Take them in the order they are listed.** They run from what an embedding
    is, to one specific way of building them, to the thing that replaced it.
    Starting with the shortest, or with the paper that looks most important,
    makes the rest harder than it needs to be.
  # Ordered general to specific, and the order is the point: what an embedding
  # is at all, then one concrete way of making them, then the architecture that
  # replaced it. Do not sort these by length. See ADR-015.
  guides:
    - boodlebox
  readings:
    # 1. What embeddings are
    - 3blue1brown-word-vectors
    - hf-llm-embedding-primer
    - rpp-119-nlp
    # 2. One specific way of building them
    - alammar-illustrated-word2vec
    # 3. What replaced it
    - alammar-seq2seq-attention
    - 3blue1brown-transformers
    - rpp-121-transformers
  questions:
    - What does it mean for two words to be "close together" in an embedding space?
    - >-
      A word becomes a vector. What has to happen for a whole *sentence* to
      become one, and what does that cost you?
    - >-
      Word2vec gives "bank" one vector for every sentence it ever appears in. A
      current model gives it a different one each time. What does that buy, and
      what does it cost?
    - >-
      Episodes 119 and 121 were recorded two weeks apart, in the last summer
      before ChatGPT. What does Burchell expect to matter, and what does she not
      see coming?
  activity: >-
    Embedding-space exploration; the classic king/queen analogy, and where it
    fails. The lecture slides — and the story of how they were generated from
    four prompts — are on the [Slides page](../slides/index.md).
  optional: [tf-embedding-projector]

- week: 2
  day: thu
  kind: lab
  topic: 'Lab: Counting Words, and Where Counting Runs Out'
  theme: foundations
  notebook: w02-thu
  summary: >-
    Everything from Tuesday, run rather than read. Tokenization, bag of words,
    TF-IDF, and word2vec -- in a notebook that opens in your browser with
    nothing installed.


    **Thursday is you showing what you found, not us working through it
    together.** Explore the notebook before class, at whatever depth interests
    you, and bring one thing worth ten minutes.
  guides:
    - colab
    - 'setup#week-2-python-on-your-own-machine-optional'
  activity: >-
    Everyone takes ten minutes, informally, laptop open. No slides required and
    no presentation expected -- open the cell, say what you did, say what
    happened.


    A finding is a claim plus the evidence you ran, and it fits in three
    sentences: *I expected X, I ran Y, I got Z, which surprised me because...*
    **A method that broke is worth more than one that worked.** These labs are
    graded on the write-up, not the result, and "I could not get this to work
    and here is exactly where it stopped" is a legitimate ten minutes that
    usually helps four other people.


    What people tend to bring, roughly in order of how interesting it turns out
    to be: a method that broke -- a stemming collision, an analogy that failed
    absurdly, a similarity score that is plainly wrong. Their own corpus run
    through TF-IDF, and whether the top terms matched what those documents are
    actually about. A tokenization failure that is *not* letter counting. How
    much text word2vec needs before it stops producing nonsense. Bias found in
    the pretrained vectors, with the line that produced it.


    You do not need working code to have something to show. A screenshot, a
    table pasted into a document, or a conversation with a chatbot where you
    worked out what an output meant are all fine. **A confusion you can state
    precisely is a contribution** -- half of what makes these sessions useful is
    somebody saying the thing four other people were quietly stuck on.


    Bring a laptop. If you have not opened the notebook at all, come anyway and
    sit with someone who has.
  optional:
    - google-colab
    - colab-intro-notebook
    - scikit-learn-text
    - sklearn-feature-extraction
    - gensim-word2vec
    - hf-tokenizers-summary
    - tf-embedding-projector

