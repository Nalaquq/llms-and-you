# The 28 meetings of Fall 2026.
#
# No dates here. Sessions declare (week, day); calendar.py assigns the real date
# and flags it as an individual-meeting session if it falls inside such a window.
#
# `guides` points at a page in docs/guides/, optionally at one heading in it,
# and is validated against the file. If we wrote a guide, the session where a
# student needs it has to name it -- see test_every_guide_is_reachable_from_a_session.
#
# Rhythm: Tuesday carries the reading, Thursday is hands-on and assigns no new
# prep. Two weeks break the pattern because a break removes one meeting (W8, W14),
# and three weeks run as individual meetings rather than a group class (W4, W5, W10).

# ===========================================================================
# WEEK 1 — Orientation
# ===========================================================================

- week: 1
  day: tue
  topic: Attention, and Why This Course Is Named After a Paper
  theme: foundations
  summary: >-
    What the course is, how it runs, and what an LLM actually is before we go
    anywhere near the mathematics. We also set the ground rules for using these
    tools on work you submit.
  readings: []
  optional: [karpathy-busy-person-intro, ms-copilot, boodlebox]
  questions:
    - What do you currently believe an LLM is doing when it answers you?
    - Where did that belief come from?
    - >-
      What would count as using these tools well in a course about them, and
      what would count as using them badly?
  activity: >-
    Syllabus walkthrough and a live prompting demo where the model is asked
    something it will confidently get wrong. We then spend real time on the AI
    policy: what counts as a hallucination, what counts as slop, what an
    adequate citation looks like, and where the line sits. Bring hard cases --
    the ambiguous ones are the useful ones, and it is better to argue about
    them now than in Week 9.

- week: 1
  day: thu
  kind: lab
  topic: 'Lab: Your Repository, and a Decision Record'
  theme: methodology
  summary: >-
    We build the thing you will work in for the rest of the semester -- a GitHub
    account, your own copy of the project template, and the two tools that read
    it. Then the practice that runs through the whole course: writing down what
    you decided and why, while you are deciding it.
  guides:
    - 'setup#week-1-your-repository-and-your-tools'
    - writing-adrs
  activity: |-
    Steps 1 to 6 are done together, one line at a time, on whatever machine you
    brought. Nothing is assumed. If something does not work on your machine that
    is normal, and it is my problem to solve rather than yours.

    Every step below is also written out in
    [the setup guide](../guides/setup.md#week-1-your-repository-and-your-tools).
    That page is the fallback: use it if you miss this session, if you get a
    step wrong, or if you are setting up a second machine later in the term.

    **Windows, macOS, or Linux -- all three are fine.** Everything you type
    today is identical on all of them. From Week 2 the two diverge, and from
    then on every command on this site is given twice: once for macOS and Linux,
    once for Windows PowerShell. Pick your tab once in
    [the setup guide](../guides/setup.md#week-2-python-and-vs-code) and the
    whole site follows you.

    ### 1. Make a GitHub account

    Free. Pick a username you would be willing to put on a CV -- this account
    will outlive the course.
    [:material-compass-outline: Guide](../guides/setup.md#a-github-account)

    ### 2. Take your own copy of the project template

    Open the course project template and press the green **Use this template**
    button. **Not fork.** A fork stays tied to my repository; a template copy is
    yours. Make it public and give it a name that says what it is.
    [:material-compass-outline: Guide](../guides/setup.md#your-own-copy-of-the-project-template)

    ### 3. Clone it to your machine

    ```bash
    git clone https://github.com/YOUR-USERNAME/YOUR-PROJECT.git
    cd YOUR-PROJECT
    ```

    Put it somewhere you will find it again. That sounds trivial. It is the
    first of today's decisions, and you will be writing it up before you leave.
    [:material-compass-outline: Guide](../guides/setup.md#clone-it)

    Then turn on the credential guard, once per clone:

    ```bash
    git config core.hooksPath .githooks
    ```

    It refuses any commit containing something shaped like an API key. A key
    pushed to GitHub is scraped within minutes, and deleting it in the next
    commit does not remove it -- it stays in the history.

    ### 4. Install the Claude Code CLI

    `claude`, in a terminal. Sign in when it asks. The difference that matters
    is that it can **see and change the files in a folder**: a chat window only
    knows what you paste into it, while Claude Code reads the directory, opens
    the files, and edits them in place.

    Start it inside your clone and ask it something ordinary:

    ```
    what is in this repository, and what is each folder for?
    ```

    Read the answer against step 6 below. It will be broadly right. Notice where
    it is confident and wrong -- we spend Week 6 on why that happens.
    [:material-compass-outline: Guide](../guides/setup.md#claude-code-the-cli-we-use-all-term)

    ### 5. Install VS Code

    Then open your cloned folder in it -- **File > Open Folder**, not open-a-file
    -- and run `claude` again from VS Code's built-in terminal, so the editor and
    the model are looking at the same directory. The Python extension comes next
    week. Today it is somewhere to see the files.
    [:material-compass-outline: Guide](../guides/setup.md#vs-code)

    ### 6. Walk the structure

    You did not build this layout, so none of it is obvious. Every folder in it
    is something the course grades, and we go through them together -- the same
    table is in [the setup guide](../guides/setup.md#what-is-in-the-folder) for
    when you need it again:

    | Path | What it is for |
    |:---|:---|
    | `TODO.txt` | What the next version of your prompt needs to do |
    | `PROMPTING.md` | The practices this course grades. Read this one first |
    | `prompts/` | Your prompts, as versioned files -- one file per prompt |
    | `src/project/` | Your code. `client.py` is written for you; the rest is yours |
    | `evals/` | Your test set. Started in week one, not the week before it is due |
    | `docs/adr/` | Your decision log -- why you chose things. Graded |
    | `CHANGELOG.md` | What changed and when. Graded alongside the ADRs |
    | `tests/` | Ordinary tests, for the parts that are ordinary code |

    Open `TODO.txt` and put a line in it before you leave. It is a running list
    of what the next draft of your prompt has to do, in sections by where each
    item ends up -- in the prompt itself, in `evals/`, in an ADR, or in a
    question for me. Keeping it is the cheap version of what the rest of this
    lab is about. An hour after you have the thought, you no longer have it.

    ### 7. Then the actual lab

    All of that required decisions, and you made them without noticing: which
    install method, what you named the repository, where you put the folder,
    whether you took the first thing Claude Code suggested or pushed back. Go
    back and write three of them up as Architectural Decision Records, using the
    [Nygard template](../guides/writing-adrs.md#the-template) -- context,
    decision, alternatives, consequences. They go in `docs/adr/`, where the
    template is already waiting for you.

    Read [Writing ADRs](../guides/writing-adrs.md) before you start. It has the
    template, the four required ADRs and when each is due, and -- the part worth
    your time -- [what separates a good one from a bad
    one](../guides/writing-adrs.md#what-separates-a-good-adr-from-a-bad-one).

    Then keep going. Give Claude Code a small task in your repository and **write
    the record as you decide, not afterwards.** You will notice these are
    different activities: the second is harder, slower, and honest, and the
    difference between them is most of what this practice is worth.

    **ADR-001 is due** -- any one of them, your choice. Commit it and push it, so
    it is on GitHub rather than only on your laptop. What is graded is whether
    the alternatives section contains a real alternative.

    Something not working? [When something
    breaks](../guides/setup.md#when-something-breaks) lists the errors this lab
    actually produces and what each one means. Bring the exact error text.
  optional:
    - github
    - project-template
    - github-hello-world
    - git-handbook
    - claude-code
    - claude-code-setup
    - claude-code-quickstart
    - vscode
    - adr-github
    - adr-templates
    - claude-desktop

# ===========================================================================
# WEEK 2 — How text becomes numbers
# ===========================================================================

- week: 2
  day: tue
  topic: How Text Becomes Numbers
  theme: foundations
  summary: >-
    Tokens and embeddings. The unglamorous step everyone skips, and the reason
    models behave strangely at the edges of words.
  readings:
    - 3blue1brown-word-vectors
    - alammar-illustrated-word2vec
    - alammar-seq2seq-attention
    - 3blue1brown-transformers
    - rpp-121-transformers
  questions:
    - What does it mean for two words to be "close together" in an embedding space?
    - >-
      A word becomes a vector. What has to happen for a whole *sentence* to
      become one, and what does that cost you?
    - >-
      Episode 121 was recorded three months before ChatGPT was released. What
      does Burchell expect to matter, and what does she not see coming?
  activity: Embedding-space exploration; the classic king/queen analogy, and where it fails.

- week: 2
  day: thu
  kind: lab
  topic: 'Lab: Python, and Why "Strawberry" Has Three R''s'
  theme: foundations
  summary: >-
    Python and VS Code set up, then the first thing we measure with them: how
    text becomes tokens, and what that costs you.
  guides:
    - 'setup#week-2-python-and-vs-code'
  activity: >-
    First, the toolchain. Install Python and VS Code, make a virtual
    environment, and `pip install anthropic`. Again: line by line, together, no
    experience assumed.


    Then use it. Call the API's own token counter on text you write and watch
    where the boundaries fall. Find three tasks that fail for tokenization
    reasons and write up why -- counting letters is the famous one, but it is
    not the most interesting.


    One thing to carry forward: the counter is **model-specific**. A token count
    from a different vendor's tokenizer is simply wrong here, and guessing is
    how cost estimates go wrong. First Burchell reflection due.
  optional: [anthropic-token-counting, anthropic-sdk-python, claude-quickstart, vscode]

# ===========================================================================
# WEEK 3 — The architecture
# ===========================================================================

- week: 3
  day: tue
  topic: Attention and the Transformer
  theme: foundations
  summary: >-
    The 2017 paper the course is named after. We read it for its argument and
    its structure, not its mathematics.
  guides:
    - reading-papers
  readings:
    - alammar-illustrated-transformer
    - 3blue1brown-attention
    - vaswani-2017-attention
  optional: [prince-understanding-deep-learning]
  questions:
    - What problem was attention invented to solve?
    - >-
      Query, key, and value. Say what each one is for in a sentence that does
      not use the other two words.
    - What did the paper give up in exchange, and why was that trade worth making?
    - Why is the title a joke, and who was it aimed at?
  activity: >-
    Guided read-through of Section 3. Practice reading a paper you cannot fully
    understand -- a skill you will need all semester.

- week: 3
  day: thu
  kind: lab
  topic: 'Lab: Watching Attention Work'
  theme: foundations
  summary: Attention weights made visible on real sentences.
  activity: >-
    Use an attention-visualisation tool on ambiguous sentences. Predict where
    the model will attend before you look, then find a case where you were wrong.

# ===========================================================================
# WEEK 4 — Prompting fundamentals  (Tuesday: individual meetings)
# ===========================================================================

- week: 4
  day: tue
  topic: 'Individual Meetings: Project Direction'
  theme: technique
  summary: >-
    Zero-shot, few-shot, and the shape of an instruction -- worked through on
    your own this week, then discussed one-to-one.
  guides:
    - conference-weeks
  readings: [boonstra-prompt-engineering, dair-prompting-guide, anthropic-pe-docs]
  questions:
    - When does adding examples stop helping?
    - What is the difference between a prompt that works and a prompt you can defend?
  activity: >-
    Work through the DAIR technique pages and post one worked before/after
    example to the discussion board.


    Bring to your meeting: that worked example, and a question about your
    project idea.

- week: 4
  day: thu
  kind: lab
  topic: 'Lab: Iteration Under Constraint'
  theme: technique
  summary: Same task, five prompts, one measurable outcome — driven from Python.
  activity: >-
    You are given a task and a scoring rubric. Improve your prompt across five
    documented iterations, run from a script so the comparison is real rather
    than remembered.


    We also settle a question that trips up anyone learning from older material:
    frontier models have **removed** `temperature` and `top_p` -- sending them
    returns an error -- and replaced them with an `effort` setting. Sweep effort
    instead, and notice that the knob the internet still tells you to turn no
    longer exists. Tutorials rot; the API reference does not.
  optional: [anthropic-pricing]

# ===========================================================================
# WEEK 5 — Taxonomy and project launch  (both sessions: individual meetings)
# ===========================================================================

- week: 5
  day: tue
  topic: 'Individual Meetings: Technique Selection'
  theme: technique
  summary: >-
    Fifty-eight named techniques and the vocabulary to tell them apart -- read
    on your own, then narrowed to three in conversation.
  guides:
    - conference-weeks
    - reading-papers
  readings: [schulhoff-2024-prompt-report]
  optional: [learn-prompting, dair-prompt-hub]
  questions:
    - Which three techniques are plausibly useful for your project, and why those?
    - Which named techniques look to you like the same idea under two names?
  activity: >-
    Annotate the taxonomy as you read.


    Bring to your meeting: three candidate techniques, and an argument for one.

- week: 5
  day: thu
  kind: milestone
  topic: 'Individual Meetings: Project Proposal & Goal Setting'
  theme: methodology
  summary: >-
    Your semester project gets defined this week, one student at a time.
  guides:
    - conference-weeks
    - 'writing-adrs#the-four-required-adrs'
  due: Project proposal + ADR-002 (technique selection and rationale)
  activity: >-
    Bring your one-page proposal and the decision record explaining which
    techniques you chose and what you rejected. We agree on scope, and you leave
    with a written goal for the next milestone.

# ===========================================================================
# WEEK 6 — Chain-of-thought and its critics  (in person, by design)
# ===========================================================================

- week: 6
  day: tue
  topic: Chain-of-Thought — and Whether It Is Real
  theme: technique
  summary: >-
    The most-cited technique in the field, assigned alongside the paper arguing
    it is an illusion. Held in person because the argument is the lesson.
  guides:
    - reading-papers
  readings: [cot-mirage]
  optional: [theoretical-framework-pe]
  questions:
    - What exactly does the "mirage" paper claim, and what does it NOT claim?
    - What experiment would settle this? Could you run it?
    - >-
      If chain-of-thought works but not for the reasons people say, does that
      change how you should use it?
  activity: >-
    Structured debate. Half the room defends chain-of-thought as reasoning; half
    argues it is pattern-matching over the training distribution.

- week: 6
  day: thu
  kind: lab
  topic: 'Lab: Testing the Mirage'
  theme: technique
  summary: Run the disagreement yourself.
  activity: >-
    Construct tasks inside and outside the plausible training distribution.
    Compare chain-of-thought against direct prompting on both. Report what you find.

# ===========================================================================
# WEEK 7 — Hallucination
# ===========================================================================

- week: 7
  day: tue
  topic: Truthfulness and the Confident Wrong Answer
  theme: truthfulness
  summary: >-
    Models say false things fluently. TruthfulQA's uncomfortable finding is that
    bigger models were worse.
  guides:
    - reading-papers
  readings: [lin-2021-truthfulqa, rpp-188-bias-truthfulness]
  optional: [burchell-lies-damned-lies]
  questions:
    - Why would a LARGER model be less truthful? What is it learning to imitate?
    - Is "truthful" the same property as "not hallucinating"?
  activity: >-
    Run TruthfulQA-style questions live and score them as a room. Second
    Burchell reflection due.

- week: 7
  day: thu
  kind: lab
  topic: 'Lab: Build an Evaluation'
  theme: truthfulness
  summary: >-
    You cannot claim a prompt is better without a way to measure it. This is that
    way.
  activity: >-
    Build a small evaluation set for your project domain -- 20 items, with
    ground truth. You will use it for the rest of the semester.
  optional: [hf-hallucinations-leaderboard, huggingface]

# ===========================================================================
# WEEK 8 — Fall Break Tuesday; midterm opens Thursday
# ===========================================================================

- week: 8
  day: thu
  kind: lab
  topic: 'Midterm Kickoff: Red-Teaming'
  theme: responsible
  summary: >-
    Fall Break takes Tuesday, so the week is a single working session -- which
    suits a lab that needs no advance reading.
  activity: >-
    HackAPrompt introduction and supervised start. Adversarial prompting rules
    of engagement, and why we are doing this in a classroom rather than on a
    production system.
  optional: [hackaprompt]

# ===========================================================================
# WEEK 9 — Evaluation and the midterm
# ===========================================================================

- week: 9
  day: tue
  topic: Factuality Is Not Hallucination
  theme: truthfulness
  summary: >-
    A live disagreement in the literature about what the benchmarks are even
    measuring -- read against the TruthfulQA paper from Week 7.
  guides:
    - reading-papers
  readings: [hallulens, li-2023-halueval]
  optional: [huang-2023-hallucination-survey, awesome-hallucination-detection]
  questions:
