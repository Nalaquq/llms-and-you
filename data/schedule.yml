    - reading-papers
  readings: [lewis-2020-rag, pinecone-chunking]
  optional: [boonstra-prompt-engineering, info7375-playlist]
  questions:
    - What problem does retrieval solve that a longer prompt does not?
    - Where does chunking go wrong, and how would you detect it?
  activity: >-
    Work through the RAG walkthrough at your own pace.


    Bring to your meeting: whatever you got stuck on. Debugging together is what
    the time is for.

- week: 10
  day: thu
  kind: milestone
  topic: 'Individual Meetings: Prototype Review & Goal Setting'
  theme: rag
  summary: A working retrieval pipeline, however small, reviewed one-to-one.
  guides:
    - conference-weeks
    - 'writing-adrs#the-four-required-adrs'
  due: Working RAG prototype + ADR-004 (retrieval design)
  activity: >-
    Demonstrate your prototype and talk through what you decided about chunking,
