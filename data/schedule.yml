# ===========================================================================
# WEEK 11 — Agents, part one
# ===========================================================================

- week: 11
  day: tue
  topic: Reasoning and Acting
  theme: agents
  summary: >-
    From answers to actions. ReAct is a prompting pattern before it is an
    architecture, which is exactly why it belongs in this course.
  guides:
    - reading-papers
  readings: [yao-2022-react, schick-2023-toolformer]
  optional: [shinn-2023-reflexion]
  questions:
    - What is ReAct actually adding to a prompt? Write the template from memory.
    - What can go wrong in a loop that cannot go wrong in a single response?
  activity: Trace an agent loop by hand on paper before letting a model run one.

- week: 11
  day: thu
  kind: lab
  topic: 'Lab: Giving a Model a Tool'
  theme: agents
  summary: Tool descriptions are prompts. Write them badly and watch what happens.
  activity: >-
    Define a tool, write its description three different ways, and measure how
    often the model calls it correctly.
  optional: [anthropic-writing-tools-for-agents]

# ===========================================================================
# WEEK 12 — Agents, part two
# ===========================================================================

- week: 12
  day: tue
  topic: Agents, Workflows, and Knowing the Difference
  theme: agents
  summary: >-
    Most things called agents are workflows, and most things that should be
    workflows are being built as agents.
  guides:
    - reading-papers
  readings: [anthropic-building-effective-agents, yao-2024-tau-bench]
  optional: [mcp-docs, jimenez-2023-swebench]
  questions:
    - Name the five workflow patterns. Which one is your project?
    - How does τ-bench decide whether an agent succeeded? Would that work for you?
  activity: >-
    Classify a set of real systems as workflow or agent, and argue the
    borderline cases.

- week: 12
  day: thu
  kind: lab
  topic: 'Lab: Build the Simplest Thing That Works'
  theme: agents
  summary: >-
    Anthropic's advice is to avoid building an agent. We take that seriously and
    test it.
  activity: >-
    Build your task twice -- once as a fixed workflow, once as an agent. Compare
    reliability, cost, and how long each took to debug.

# ===========================================================================
# WEEK 13 — Open weights
# ===========================================================================

- week: 13
  day: tue
  topic: What It Costs to Run This for Other People
  theme: deployment
  summary: >-
    Everything changes when a system has to serve someone other than you. Token
    accounting, caching, batching, rate limits, and the arithmetic of cost per
    user per month.
  readings: [anthropic-prompt-caching, anthropic-errors]
  optional:
    - anthropic-batch-processing
    - anthropic-pricing
    - anthropic-context-windows
    - anthropic-cookbook
    - claude-api-overview
  questions:
    - >-
      Caching is a prefix match. Why does putting a timestamp at the top of your
      system prompt destroy the cache for everything below it?
    - >-
      Estimate your project's cost per user per month. Show the arithmetic. What
      dominates -- input tokens, output tokens, or something you had not counted?
    - What does your system do when it gets a 429, and who notices?
  activity: >-
    Cost teardown. We take a real prompt, count its tokens, price it, then cut
    the cost without cutting the quality -- caching the stable prefix, batching
    what is not urgent, and choosing a cheaper model where the task allows.

- week: 13
  day: thu
  kind: lab
  topic: 'Lab: Instrument It, Then Run One Yourself'
  theme: deployment
  summary: >-
    Measure what your project costs, then ask the build-versus-buy question by
    running an open-weight model on your own hardware.
  activity: >-
    First: instrument your project. Log tokens and cost per call, add caching to
    the stable part of your prompt, and measure the difference -- an unmeasured
    optimisation is a guess.


    Then the other side of the same decision: run a small open-weight model
    locally and compare it to the frontier model on your Week 7 evaluation set.
    The question is not which is better. It is what you would have to believe
    about volume, latency, privacy, and your own time for self-hosting to win.
  optional: [jiang-2023-mistral7b, open-weights-timeline, nnsight-ndif]

# ===========================================================================
# WEEK 14 — Responsible AI  (Thanksgiving takes Thursday)
# ===========================================================================

- week: 14
  day: tue
  topic: Auditing, Labour, and What Gets Released
  theme: responsible
  summary: >-
    Who is answerable when a system trained on everyone's writing makes a
    decision about one person — and who decides what gets released at all. A
    single session before the break, and the least technical week on purpose.
  readings: [auditing-ai, verge-ai-factory, amodei-2026-open-weights]
  optional:
    - stanford-hai-open-weight
    - dubey-2024-llama3
    - qi-2025-durable-safeguards
    - cyber-risk-open-weight
    - lithub-replace-myself
  questions:
    - Pick one failure case from Auditing AI. What would an audit have caught?
    - >-
      After reading Dzieza, does anything about how you have used these tools
      this semester look different?
    - >-
      Amodei runs a company that does not release its weights. How does that
      shape his argument — and is the argument wrong because of it?
  activity: >-
    Two halves. First an audit design workshop: in groups, design an audit for a
    system in the reading, then apply the same method to your own project.


    Then a position-taking exercise on release policy — you are assigned a
    stakeholder (lab, regulator, researcher, adversary) and must argue their
    case. The two halves are the same question at different scales: who is
    accountable, and how would anyone check?

# ===========================================================================
# WEEK 15 — The argument, and the finish
# ===========================================================================

- week: 15
  day: tue
  topic: Scaling Limits and the Hype Cycle
  theme: critical
  summary: >-
    The course argues with itself. Four years of one guest's commentary, ending
    two months before this class started.
  readings: [rpp-264-scaling-laws, rpp-291-reassessing, karpathy-animals-vs-ghosts]
  optional: [pydantic-human-in-the-loop, burchell-beyond-the-hype]
  questions:
    - >-
      Trace the Burchell arc from Episode 121 to Episode 291. What changed in
      the field, and what changed in her?
    - Which claim from Week 1 of this course do you now think was wrong?
  genai: prohibited
  genai_note: >-
    The final reflection is written by hand, in class, about your own change of
    mind over fifteen weeks. Nothing else can write it and nothing else should.
  activity: >-
    Final Burchell reflection, written in class: what you believed in August and
    what you believe now.

- week: 15
  day: thu
  kind: milestone
  topic: Final Presentations
  theme: methodology
  summary: The project, the decision log, and what you would do differently.
  guides:
    - 'writing-adrs#the-four-required-adrs'
  due: Final project, ADR log, and reflective introduction
  activity: >-
    Presentations. Ten minutes each: what you built, which decisions you
    recorded, and which one you got wrong.
