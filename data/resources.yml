# The course library. Every assignable thing, defined exactly once.
#
# Sessions in schedule.yml reference these by `id`, never by URL. Fix a link here
# and it is fixed on every page that assigns it.
#
# We do not host PDFs. `access` is the honest answer to "can a student open this
# right now?" and renders as a badge next to the reading.
#
# All URLs verified 2026-08-25.

# ---------------------------------------------------------------------------
# Theme 1 — How LLMs Work
# ---------------------------------------------------------------------------

- id: 3blue1brown-word-vectors
  title: How word vectors encode meaning
  authors: [Grant Sanderson]
  kind: video
  url: https://www.youtube.com/shorts/FJtFZwbvkI4
  themes: [foundations]
  est_minutes: 1
  assign_note: >-
    One minute. Watch it before class and again after -- it is the king/queen
    analogy in its shortest possible form, and Thursday's lab is about where
    that analogy stops working.

- id: 3blue1brown-transformers
  title: 'Transformers, the tech behind LLMs (Deep Learning, Chapter 5)'
  authors: [Grant Sanderson]
  kind: video
  url: https://www.youtube.com/watch?v=wjZofJX0v4M
  themes: [foundations]
  est_minutes: 27
  assign_note: >-
    Watch the whole thing. It starts at tokens and embeddings -- exactly where
    this week starts -- and carries you to the end of a working Transformer
    without asking you to have seen a neural network before.
  note: >-
    Foundations spine. Begins at the embedding matrix rather than at gradient
    descent, which is why it replaced the Neural Networks series. See ADR-006.

- id: 3blue1brown-attention
  title: 'Attention in transformers, step-by-step (Deep Learning, Chapter 6)'
  authors: [Grant Sanderson]
  kind: video
  url: https://www.youtube.com/watch?v=eMlx5fFNoYc
  themes: [foundations]
  est_minutes: 26
  assign_note: >-
    Watch this after Alammar and before Vaswani. It builds the query, key, and
    value matrices on screen, one multiplication at a time. When Section 3 of
    the paper names those three things without explaining them, this is the
    thing you will be remembering.

- id: prince-understanding-deep-learning
  title: Understanding Deep Learning
  authors: [Simon J.D. Prince]
  year: 2023
  kind: book
  url: https://udlbook.github.io/udlbook/
  themes: [foundations]
  note: >-
    Free PDF from MIT Press. Considerably more mathematical than this course
    requires -- here for students who want the rigorous version, not assigned.

- id: karpathy-busy-person-intro
  title: "[1hr Talk] Intro to Large Language Models"
  authors: [Andrej Karpathy]
  year: 2023
  kind: video
  url: https://www.youtube.com/watch?v=zjkBMFhNj_g
  themes: [foundations]
  est_minutes: 60
  assign_note: >-
    Watch the whole thing. It is the single best orientation to what this course
    is about, and it assumes nothing.

- id: alammar-illustrated-transformer
  title: The Illustrated Transformer
  authors: [Jay Alammar]
  kind: guide
  url: https://jalammar.github.io/illustrated-transformer/
  themes: [foundations]
  est_minutes: 45
  assign_note: >-
    Read this BEFORE the Vaswani paper. It is the map; the paper is the terrain.

- id: alammar-illustrated-word2vec
  title: The Illustrated Word2Vec
  authors: [Jay Alammar]
  kind: guide
  url: https://jalammar.github.io/illustrated-word2vec/
  themes: [foundations]
  est_minutes: 35
  assign_note: >-
    How text becomes numbers. Focus on the embedding intuition, not the training
    algorithm.

- id: hf-llm-embedding-primer
  title: 'LLM Embeddings Explained: A Visual and Intuitive Guide'
  authors: [hesamation]
  kind: guide
  url: https://huggingface.co/spaces/hesamation/primer-llm-embedding
  themes: [foundations, ecosystem]
  est_minutes: 40
  assign_note: >-
    All of it. The sections build: word2vec, then BERT, then what current models
    actually do. The payoff is the last of those -- seeing why one fixed vector
    per word stopped being good enough.
  note: >-
    The piece Alammar does not cover, because it did not exist yet: contextual
    embeddings, and embeddings as they are computed inside a running LLM.

- id: alammar-seq2seq-attention
  title: Visualizing a Neural Machine Translation Model (Seq2seq with Attention)
  authors: [Jay Alammar]
  year: 2018
  kind: guide
  url: https://jalammar.github.io/visualizing-neural-machine-translation-mechanics-of-seq2seq-models-with-attention/
  themes: [foundations]
  est_minutes: 30
  assign_note: >-
    The post that earns the Transformer. Read it for the bottleneck: an
    encoder-decoder that must squeeze a whole sentence into one fixed-length
    vector, and what breaks when the sentence is long. Stay with the animated
    alignment heatmaps near the end -- that picture is what "attention" means
    before any mathematics is attached to it.
  note: >-
    Alammar's own precursor to The Illustrated Transformer, and the missing
    first rung. Illustrated Transformer opens at self-attention and Vaswani
    assumes seq2seq is already familiar, so without this the Week 3 question
    "what problem was attention invented to solve?" has no assigned answer.

- id: vaswani-2017-attention
  title: Attention Is All You Need
  authors: [Vaswani, et al.]
  year: 2017
  kind: paper
  url: https://arxiv.org/abs/1706.03762
  themes: [foundations]
  est_minutes: 50
  assign_note: >-
    Abstract, Introduction, and Section 3 (the architecture) only. The math in
    Sections 4-6 is optional. You are reading this for the argument and for the
    experience of reading the paper the course is named after.

- id: rpp-119-nlp
  title: 'Real Python #119: Natural Language Processing and How ML Models Understand Text'
  authors: [Jodie Burchell]
  year: 2022
  kind: podcast
  url: https://realpython.com/podcasts/rpp/119/
  themes: [foundations, critical]
  est_minutes: 58
  note: >-
    Burchell arc, episode 1 of 6. The classical NLP pipeline, before any of this
    was called an LLM -- which is what makes the next four years legible.

- id: rpp-121-transformers
  title: 'Real Python #121: Moving NLP Forward With Transformer Models and Attention'
  authors: [Jodie Burchell]
  year: 2022
  kind: podcast
  url: https://realpython.com/podcasts/rpp/121/
  themes: [foundations, critical]
  est_minutes: 50
  note: >-
    Burchell arc, episode 2 of 6. Recorded BEFORE ChatGPT shipped -- the reason
    it is assigned is that it does not know what is coming.

- id: rpp-232-sentiment
  title: 'Real Python #232: Exploring Modern Sentiment Analysis Approaches in Python'
  authors: [Jodie Burchell]
  year: 2024
  kind: podcast
  url: https://realpython.com/podcasts/rpp/232/
  themes: [foundations, technique]
  est_minutes: 73
  note: Burchell arc, episode 4 of 6. Lexicon to ML to LLM; encoder vs decoder.

